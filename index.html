<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fun Friday Jamming</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* RESET */
* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

/* BODY */
body {
  background: radial-gradient(circle at top, #0a0a0a, #000);
  color: white;
  font-family: 'Poppins', sans-serif;
  text-align: center;
  overflow-x: hidden;
}

/* LAYOUT (FOOTER FIX) */
.main-container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.content {
  flex: 1;
}

/* BRAND */
.brand {
  margin-top: 20px;
}

.brand p {
  color: #aaa;
  letter-spacing: 3px;
  font-size: 14px;
}

/* HEADER */
.top-text {
  margin-top: 10px;
}

.top-text h2 {
  color: #a3e635;
  letter-spacing: 3px;
}

.top-text h1 {
  font-size: 90px;
  font-weight: 900;
  margin: 0;
  letter-spacing: 5px;
}

/* TAGS */
.tags {
  margin-top: 15px;
  margin-bottom: 30px;
  color: #ccc;
  letter-spacing: 2px;
  font-size: 14px;
}

/* HERO */
.hero {
  position: relative;
  min-height: 650px;
  margin-top: 20px;
  perspective: 1200px;
}

/* RING */
.ring {
  position: absolute;
  width: 700px;
  height: 250px;
  border-radius: 50%;
  background: linear-gradient(90deg, #22c55e, #a855f7);
  filter: blur(60px);
  left: 50%;
  transform: translateX(-50%);
  top: 50%;
}

/* CAROUSEL */
.carousel {
  position: absolute;
  width: 400px;
  height: 400px;
  top: 50%;
  left: 50%;
  transform-style: preserve-3d;
  transform: translate(-50%, -50%);
  animation: spin 20s linear infinite;
}

/* IMAGES */
.carousel img {
  position: absolute;
  width: 160px;
  height: 220px;
  border-radius: 20px;
  object-fit: cover;
  box-shadow: 0 0 20px rgba(255,255,255,0.2);
  transition: 0.3s;
}

.carousel img:hover {
  transform: scale(1.1);
}

/* POSITIONS */
.carousel img:nth-child(1) { transform: rotateY(0deg) translateZ(350px); }
.carousel img:nth-child(2) { transform: rotateY(60deg) translateZ(350px); }
.carousel img:nth-child(3) { transform: rotateY(120deg) translateZ(350px); }
.carousel img:nth-child(4) { transform: rotateY(180deg) translateZ(350px); }
.carousel img:nth-child(5) { transform: rotateY(240deg) translateZ(350px); }
.carousel img:nth-child(6) { transform: rotateY(300deg) translateZ(350px); }

/* ROTATION */
@keyframes spin {
  from { transform: translate(-50%, -50%) rotateY(0deg); }
  to { transform: translate(-50%, -50%) rotateY(360deg); }
}

/* EVENT INFO */
.event-info {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 50px;
  padding: 15px 30px;
  border-radius: 50px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  z-index: 10;
  animation: glowPulse 3s ease-in-out infinite;
}

.info-box {
  display: flex;
  align-items: center;
  gap: 10px;
}

.info-box span {
  font-size: 20px;
}

.info-box h4 {
  margin: 0;
  font-size: 14px;
  color: #a3e635;
}

.info-box p {
  margin: 0;
  font-size: 12px;
  color: #ccc;
}

/* GLOW */
@keyframes glowPulse {
  0% { box-shadow: 0 0 10px #22c55e, 0 0 20px #a855f7; }
  50% { box-shadow: 0 0 25px #22c55e, 0 0 50px #a855f7; }
  100% { box-shadow: 0 0 10px #22c55e, 0 0 20px #a855f7; }
}

/* FORM */
.form-box {
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.05);
  padding: 30px;
  border-radius: 20px;
  width: 90%;
  max-width: 350px;
  margin: 40px auto;
  box-shadow: 0 0 30px rgba(163,230,53,0.2);
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
  outline: none;
}

button {
  width: 100%;
  padding: 15px;
  background: linear-gradient(90deg, #a3e635, #22c55e);
  border: none;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  transform: scale(1.05);
}

/* POPUP FIX */
.music-popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);

  display: flex;
  justify-content: center;
  align-items: center;

  transform: scale(0);
  opacity: 0;
  pointer-events: none;

  transition: all 0.3s ease;
  z-index: 999;
}

.music-popup.show {
  transform: scale(1);
  opacity: 1;
  pointer-events: auto;
}

.popup-content {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  padding: 30px;
  border-radius: 25px;
  text-align: center;
  width: 320px;
}

/* POPUP COLORS */
.popup-success {
  box-shadow: 0 0 20px #22c55e, 0 0 40px #22c55e;
}

.popup-error {
  box-shadow: 0 0 20px #ef4444, 0 0 40px #ef4444;
}

.popup-warning {
  box-shadow: 0 0 20px #facc15, 0 0 40px #facc15;
}

/* FOOTER */
.footer {
  padding: 40px 20px;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(10px);
  text-align: center;
  border-top: 1px solid rgba(255,255,255,0.1);
}

.footer-content {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 30px;
}

.contact-item {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #ccc;
}

.contact-item i {
  color: #a3e635;
}

.contact-item a {
  color: #ccc;
  text-decoration: none;
}

.social-icons a {
  margin: 0 10px;
  font-size: 22px;
  color: #ccc;
}

.social-icons a:hover {
  color: #a3e635;
}

.copyright {
  font-size: 14px;
  color: #888;
  margin-top: 20px;
}

/* MOBILE */
@media (max-width: 768px) {

  .top-text h1 {
    font-size: 40px;
    letter-spacing: 2px;
  }

  .top-text h2 {
    font-size: 16px;
  }

  .tags {
    font-size: 12px;
    margin-bottom: 20px;
  }

  .hero {
    min-height: 520px;
  }

  .carousel {
    width: 260px;
    height: 260px;
  }

  .carousel img {
    width: 100px;
    height: 140px;
  }

  .carousel img:nth-child(1) { transform: rotateY(0deg) translateZ(200px); }
  .carousel img:nth-child(2) { transform: rotateY(60deg) translateZ(200px); }
  .carousel img:nth-child(3) { transform: rotateY(120deg) translateZ(200px); }
  .carousel img:nth-child(4) { transform: rotateY(180deg) translateZ(200px); }
  .carousel img:nth-child(5) { transform: rotateY(240deg) translateZ(200px); }
  .carousel img:nth-child(6) { transform: rotateY(300deg) translateZ(200px); }

  .event-info {
    flex-direction: column;
    gap: 10px;
    bottom: 15px;
    padding: 12px 20px;
  }

  .ring {
    width: 300px;
    height: 150px;
  }

}

/* EXTRA SMALL */
@media (max-width: 480px) {

  .top-text h1 {
    font-size: 32px;
  }

  .carousel {
    width: 220px;
    height: 220px;
  }

}

</style>

</head>

<body>
  <div class="main-container">
    <div class="content">
<div class="brand">
  <p>ABC SCHOOL OF MUSIC PRESENTS</p>
</div>

<div class="top-text">
  <h2>FUN FRIDAY</h2>
  <h1>JAMMING SESSION</h1>

  <div class="tags">
    <span>LIVE MUSIC</span>
    <span>•</span>
    <span>OPEN MIC</span>
    <span>•</span>
    <span>CHILL VIBES</span>
  </div>
</div>

<div class="hero">

  <div class="ring"></div>

  <div class="carousel">
    <img src="images/img1.jpg">

    <img src="images/guitar.png">

  </div>
  
    <div class="event-info">
  
  <div class="info-box">
    <span>📅</span>
    <div>
      <h4>THIS FRIDAY</h4>
      <p>8 May 2026</p>
    </div>
  </div>

  <div class="info-box">

</div>
</div>


<!-- FORM -->
<form id="form" action="https://formspree.io/f/mvzlgrap" method="POST" class="form-box">

  <input type="text" id="name" name="name" placeholder="Full Name" required>

<input type="email" id="email" name="_replyto" placeholder="Email" required>

  <input type="tel" id="phone" name="phone" placeholder="WhatsApp Number" required>

  <select id="instrument" name="instrument" required>

<input type="hidden" name="_template" value="table">

<input type="hidden" name="_captcha" value="false">

<input type="hidden" name="_autoresponse" 
value="🎸 You are successfully registered!

Hi there,

</form>

<!-- POPUP -->
<div class="music-popup" id="musicPopup">
  <div class="popup-content">

    <div class="popup-icon" id="popupIcon">🎸</div>

    <h3 id="popupTitle">Title</h3>

      <a href="mailto:music@abc.com">music@abc.com</a>
    </div>

</footer>

</div>
<script>
  let soundUnlocked = false;

document.addEventListener("click", () => {
  if (!soundUnlocked) {
    const sound = document.getElementById("successSound");
    sound.play().then(() => {
      sound.pause();
      sound.currentTime = 0;
      soundUnlocked = true;
    }).catch(() => {});
  }
});
document.getElementById("form").addEventListener("submit", async function(e) {
  e.preventDefault();

  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let instrument = document.getElementById("instrument").value;

  // NAME VALIDATION
  if (name.length < 3) {
    showPopup("error", "Invalid Name", "Name must be at least 3 characters");
    return;
  }

  // EMAIL VALIDATION
  let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
  if (!email.match(emailPattern)) {
    showPopup("error", "Invalid Email", "Enter a valid email address");
    return;
  }

  // PHONE VALIDATION (India 10 digit)
  let phonePattern = /^[6-9]\d{9}$/;
  if (!phone.match(phonePattern)) {
   
  showPopup("error", "Invalid Phone", "Enter valid 10-digit phone number");
    return;
  }

  // INSTRUMENT VALIDATION
  if (!instrument) {
    showPopup("error", "Invalid Instrument", "Please select an instrument");
    return;
  }

  // DUPLICATE CHECK (basic)
  let users = JSON.parse(localStorage.getItem("registrations")) || [];
  // let exists = users.some(u => u.email === email || u.phone === phone);

  // if (exists) {
  //   showPopup("warning", "Already Registered", "You have already signed up");
  //   return;
  // }

  // SEND DATA TO FORMSPREE
  let formData = new FormData(this);
// document.getElementById("replyto").value = email;
// let response = { ok: true };
  let response = await fetch(this.action, {
    method: "POST",
    body: formData,
    headers: { 'Accept': 'application/json' }
  });

  if (response.ok) {
    // SAVE LOCALLY
    users.push({ email, phone });
    localStorage.setItem("registrations", JSON.stringify(users));
     playSound();
    showPopup("success", "🎸 Registered!", "See you at the jam 🔥");
    this.reset();

  } else {
    showPopup("error", "Registration Failed", "Something went wrong. Try again.");   
  }

});


function playSound() {
  const sound = document.getElementById("successSound");
  sound.currentTime = 0;

  sound.play().catch(err => {
    console.log("Audio blocked:", err);
  });
}
function showPopup(type, title, message) {
  const popup = document.getElementById("musicPopup");
  const content = popup.querySelector(".popup-content");

  // reset classes
  content.classList.remove("popup-success", "popup-error", "popup-warning");

  // set type
  if (type === "success") {
    content.classList.add("popup-success");
    document.getElementById("popupIcon").innerText = "🎸";
  } 
  else if (type === "error") {
    content.classList.add("popup-error");
    document.getElementById("popupIcon").innerText = "❌";
  } 
  else {
    content.classList.add("popup-warning");
    document.getElementById("popupIcon").innerText = "⚠️";
  }

  document.getElementById("popupTitle").innerText = title;
  document.getElementById("popupMessage").innerText = message;

  popup.classList.add("show");
}

function closePopup() {
  document.getElementById("musicPopup").classList.remove("show");
}

</script>
</body>
</html>
